{# Cartão de nível do munícipe. Espera a variável `lvl` (community.level_for). #}
<div class="tu-level-card">
  <div class="d-flex align-items-center gap-3">
    <div class="tu-level-icon"><i class="bi bi-{{ lvl.icon }}"></i></div>
    <div class="flex-grow-1">
      <div class="small tu-level-meta">Nível {{ lvl.number }} de 5</div>
      <div class="h5 mb-0">{{ lvl.name }}</div>
    </div>
    <div class="text-end">
      <div class="tu-level-points">{{ lvl.points }}</div>
      <div class="small tu-level-meta">pontos</div>
    </div>
  </div>
  <div class="tu-level-bar mt-3"><span style="width: {{ lvl.progress }}%"></span></div>
  <div class="small mt-2 tu-level-meta">
    {% if lvl.next_name %}Faltam <b>{{ lvl.missing }}</b> pontos para «{{ lvl.next_name }}».{% else %}Atingiu o nível máximo. Obrigado.{% endif %}
  </div>
</div>
