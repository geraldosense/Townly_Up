<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t2">O pedido é encaminhado automaticamente para o serviço técnico, a Junta de Freguesia ou a Câmara</title>
  <rect width="480" height="320" rx="16" fill="#f1ece2"/>
  <!-- pedido -->
  <g transform="translate(176 26)">
    <rect width="128" height="74" rx="12" fill="#0b2a5b"/>
    <text x="64" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e7c78c" letter-spacing="1">OCORRÊNCIA</text>
    <text x="64" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#fff">TU-2026-0042</text>
  </g>
  <!-- ligações -->
  <g fill="none" stroke="#a8834a" stroke-width="2.5" stroke-linecap="round">
    <path d="M240 100 V140 H80 V176"/><path d="M240 140 V176"/><path d="M240 140 H400 V176"/>
  </g>
  <g fill="#a8834a"><path d="M74 172 l6 10 6-10z"/><path d="M234 172 l6 10 6-10z"/><path d="M394 172 l6 10 6-10z"/></g>
  <!-- serviço técnico -->
  <g transform="translate(20 188)">
    <rect width="120" height="108" rx="12" fill="#fffdf8" stroke="#e2dacb"/>
    <circle cx="60" cy="38" r="22" fill="#e9edf4"/>
    <path d="M50 46 l14-14 m-2-6 a7 7 0 1 0 8 8 l-4-4" stroke="#0b2a5b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="60" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d2433">Serviço técnico</text>
    <text x="60" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#625c51">obras, luz, limpeza…</text>
  </g>
  <!-- junta -->
  <g transform="translate(180 188)">
    <rect width="120" height="108" rx="12" fill="#fff" stroke="#0b2a5b" stroke-width="2"/>
    <circle cx="60" cy="38" r="22" fill="#e9edf4"/>
    <path d="M44 48 V34 l16-10 16 10 V48 Z M54 48 v-8 h12 v8" stroke="#0b2a5b" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="60" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d2433">Junta de Freguesia</text>
    <text x="60" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#625c51">do local do problema</text>
  </g>
  <!-- câmara -->
  <g transform="translate(340 188)">
    <rect width="120" height="108" rx="12" fill="#fffdf8" stroke="#e2dacb"/>
    <circle cx="60" cy="38" r="22" fill="#e9edf4"/>
    <path d="M44 50 h32 M47 50 V34 M54 50 V34 M61 50 V34 M68 50 V34 M73 50 V34 M42 33 l18-11 18 11 z" stroke="#0b2a5b" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <text x="60" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d2433">Câmara Municipal</text>
    <text x="60" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#625c51">acompanha tudo</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
