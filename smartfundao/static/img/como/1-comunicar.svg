<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t1">Munícipe fotografa um buraco na estrada com o telemóvel e recebe um número de referência</title>
  <rect width="480" height="320" rx="16" fill="#f1ece2"/>
  <!-- rua ao fundo -->
  <path d="M0 250 L480 205 L480 320 L0 320Z" fill="#d9d0bf"/>
  <path d="M0 268 L480 222" stroke="#fffdf8" stroke-width="4" stroke-dasharray="26 18"/>
  <ellipse cx="96" cy="276" rx="44" ry="10" fill="#6b6253"/>
  <ellipse cx="96" cy="274" rx="34" ry="6" fill="#4a443a"/>
  <!-- candeeiro e árvore -->
  <rect x="404" y="92" width="6" height="128" fill="#8b8476"/><path d="M407 96 q0-16 22-16 h8" stroke="#8b8476" stroke-width="6" fill="none"/><rect x="430" y="80" width="18" height="8" rx="3" fill="#8b8476"/>
  <circle cx="360" cy="160" r="34" fill="#a7c4a0"/><rect x="356" y="180" width="8" height="38" fill="#8a7a62"/>
  <!-- telemóvel -->
  <g transform="translate(168 34) rotate(-6)">
    <rect width="146" height="252" rx="22" fill="#1d2433"/>
    <rect x="9" y="12" width="128" height="228" rx="14" fill="#fffdf8"/>
    <rect x="58" y="18" width="30" height="5" rx="2.5" fill="#1d2433"/>
    <!-- visor da câmara -->
    <rect x="17" y="34" width="112" height="112" rx="8" fill="#d9d0bf"/>
    <path d="M17 120 L129 104 L129 146 L17 146Z" fill="#c9bfab"/>
    <ellipse cx="62" cy="126" rx="26" ry="7" fill="#4a443a"/>
    <path d="M27 44 h14 M27 44 v14 M119 44 h-14 M119 44 v14 M27 136 h14 M27 136 v-14 M119 136 h-14 M119 136 v-14" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- pino e linhas do formulário -->
    <path d="M73 158 c-9 0-15 6-15 14 0 10 15 22 15 22s15-12 15-22c0-8-6-14-15-14z" fill="#0b2a5b"/><circle cx="73" cy="172" r="5" fill="#fffdf8"/>
    <rect x="22" y="202" width="102" height="26" rx="8" fill="#0b2a5b"/>
    <text x="73" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">Enviar</text>
  </g>
  <!-- número de referência -->
  <g transform="translate(316 34)">
    <rect width="142" height="58" rx="10" fill="#fff" stroke="#a8834a" stroke-dasharray="5 4"/>
    <text x="71" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#625c51" letter-spacing="1">REFERÊNCIA</text>
    <text x="71" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#0b2a5b">TU-2026-0042</text>
  </g>
  <path d="M304 96 q20 12 32 2" stroke="#a8834a" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
