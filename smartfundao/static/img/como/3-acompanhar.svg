<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t3" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t3">Linha temporal com os estados Registada, Em análise, Em tratamento e Resolvida, e um alerta no sino</title>
  <rect width="480" height="320" rx="16" fill="#f1ece2"/>
  <rect x="40" y="28" width="300" height="264" rx="14" fill="#fffdf8" stroke="#e2dacb"/>
  <text x="64" y="62" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#1d2433">Linha temporal</text>
  <path d="M74 92 V250" stroke="#e2dacb" stroke-width="3"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="74" cy="96" r="9" fill="#5b6475"/><text x="96" y="94" font-size="13" font-weight="700" fill="#1d2433">Registada</text><text x="96" y="110" font-size="10" fill="#625c51">encaminhada para a Junta</text>
    <circle cx="74" cy="148" r="9" fill="#a46a00"/><text x="96" y="146" font-size="13" font-weight="700" fill="#1d2433">Em análise</text><text x="96" y="162" font-size="10" fill="#625c51">técnico a avaliar o local</text>
    <circle cx="74" cy="200" r="9" fill="#1f5fbf"/><text x="96" y="198" font-size="13" font-weight="700" fill="#1d2433">Em tratamento</text><text x="96" y="214" font-size="10" fill="#625c51">equipa no terreno</text>
    <circle cx="74" cy="252" r="11" fill="#0e7a35"/><path d="M69 252 l4 4 7-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="250" font-size="13" font-weight="700" fill="#0e7a35">Resolvida</text><text x="96" y="266" font-size="10" fill="#625c51">com fotografia da intervenção</text>
  </g>
  <!-- sino com alerta -->
  <g transform="translate(372 70)">
    <circle cx="44" cy="44" r="44" fill="#0b2a5b"/>
    <path d="M30 56 V44 a14 14 0 1 1 28 0 V56 l4 5 H26 z M39 66 a5 5 0 0 0 10 0" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="70" cy="16" r="13" fill="#c62828" stroke="#f1ece2" stroke-width="3"/><text x="70" y="21" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
  </g>
  <g transform="translate(352 178)">
    <rect width="112" height="66" rx="10" fill="#fff" stroke="#e2dacb"/>
    <text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a8834a" font-weight="700" letter-spacing=".5">ALERTA</text>
    <text x="12" y="42" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d2433" font-weight="700">TU-2026-0042</text>
    <text x="12" y="56" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0e7a35" font-weight="700">foi resolvida</text>
  </g>
