# Render Blueprint — cria o serviço web do Townly Up.
# A base de dados PostgreSQL vem do Neon (gratuita, não expira): cole o endereço em DATABASE_URL.
services:
  - type: web
    name: townly-up
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # 1) tabelas  2) conta da Câmara  3) servidor (sem dados fictícios)
    startCommand: ./start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_NAME
        value: Câmara Municipal do Fundão
      - key: ADMIN_EMAIL        # a 1.ª conta da Câmara (cria as contas das Juntas e serviços no site)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY       # email com o número de referência (Brevo, gratuito até 300/dia)
        sync: false
      - key: MAIL_FROM           # remetente verificado na Brevo
        sync: false
      - key: MAIL_FROM_NAME
        value: Townly Up
      - key: PUBLIC_URL          # ex.: https://townly-up.onrender.com (para as ligações nos emails)
        sync: false
      - key: ANTHROPIC_API_KEY   # moderação automática das fotografias (Claude API)
        sync: false
